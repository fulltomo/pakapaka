name: Auto Resume Scraping Pipeline

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "開始年 (Start Year)"
        required: true
        default: "2021"
        type: string
      end_year:
        description: "終了年 (End Year)"
        required: true
        default: "2026"
        type: string
      max_races:
        description: "収集目標レース数 (0で無制限・全レース完全収集)"
        required: true
        default: "0"
        type: string
      time_limit_minutes:
        description: "1回の最大実行時間(分) (Time limit before checkpoint & restart)"
        required: true
        default: "320" # 5時間20分 (GitHub Actionsの6時間上限前に安全に終了)
        type: string
      iteration:
        description: "現在の実行ループ回数 (世代)"
        required: false
        default: "1"
        type: string
      max_iterations:
        description: "最大自動再実行回数 (無限ループ防止の安全停止上限)"
        required: false
        default: "10"
        type: string
      skip_train_until_end:
        description: "中間実行時はモデル学習をスキップし全件完了時のみ学習する"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  scrape-and-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 5時間50分 (ジョブ自体の非常停止ガード)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore existing DB from data branch or latest artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 既存データの復元 ==="
          RESTORED=false

          # 1. リモートの data ブランチから検索
          if git ls-remote --heads origin data | grep -q 'refs/heads/data'; then
            echo "リモートの data ブランチを確認中..."
            git fetch origin data:data || true
            
            # pakapaka.db.gz が存在する場合
            if git ls-tree -r data --name-only | grep -q 'pakapaka.db.gz'; then
              echo "data ブランチから pakapaka.db.gz を復元・解凍中..."
              git checkout data -- pakapaka.db.gz
              git reset HEAD pakapaka.db.gz 2>/dev/null || true
              gzip -d -c pakapaka.db.gz > pakapaka.db
              rm -f pakapaka.db.gz
              RESTORED=true
            # 非圧縮 pakapaka.db が存在する場合
            elif git ls-tree -r data --name-only | grep -q 'pakapaka.db'; then
              echo "data ブランチから pakapaka.db を復元中..."
              git checkout data -- pakapaka.db 2>/dev/null || git checkout data -- backend/pakapaka.db 2>/dev/null || true
              git reset HEAD pakapaka.db 2>/dev/null || true
              RESTORED=true
            fi
          fi

          # 2. data ブランチから取得できなかった場合の Artifact フォールバック復元
          if [ "$RESTORED" != "true" ] || [ ! -f pakapaka.db ]; then
            echo "data ブランチにデータが見つからないため、直近の Artifact からバックアップを検索します..."
            LATEST_RUNS=$(gh run list --workflow=scrape_auto_resume.yml --limit 10 --json databaseId --jq '.[].databaseId')
            for RUN_ID in $LATEST_RUNS; do
              echo "Run $RUN_ID の Artifact を確認中..."
              mkdir -p /tmp/artifact_restore
              if gh run download "$RUN_ID" --pattern "pakapaka-db-*" -D /tmp/artifact_restore 2>/dev/null; then
                DB_RESTORED=$(find /tmp/artifact_restore -name "pakapaka.db" | head -n 1)
                if [ -n "$DB_RESTORED" ] && [ -f "$DB_RESTORED" ]; then
                  cp "$DB_RESTORED" pakapaka.db
                  echo "✓ Run $RUN_ID の Artifact からデータベースを復元しました！"
                  RESTORED=true
                  break
                fi
              fi
            done
          fi

          if [ -f backend/pakapaka.db ] && [ ! -f pakapaka.db ]; then
            cp backend/pakapaka.db pakapaka.db
          fi

          if [ -f pakapaka.db ]; then
            echo "✓ データベースの復元完了 (サイズ: $(ls -lh pakapaka.db | awk '{print $5}'))"
          else
            echo "復元可能なデータが見つからないため、新規データベースで開始します。"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Scraping Pipeline with Time Limit
        id: scraper
        run: |
          echo "=== スクレイピング開始 (制限時間: ${{ inputs.time_limit_minutes }}分, ループ: 第${{ inputs.iteration }}/${{ inputs.max_iterations }}世代) ==="
          mkdir -p data/models data/cache backend/data/models backend/data/cache
          OPT_FLAGS=""
          if [ "${{ inputs.skip_train_until_end }}" = "true" ]; then
            OPT_FLAGS="--skip-train"
          fi

          python backend/scripts/scrape_real_data.py \
            --start-year "${{ inputs.start_year }}" \
            --end-year "${{ inputs.end_year }}" \
            --max-races "${{ inputs.max_races }}" \
            --time-limit-minutes "${{ inputs.time_limit_minutes }}" \
            --iteration "${{ inputs.iteration }}" \
            --max-iterations "${{ inputs.max_iterations }}" \
            $OPT_FLAGS

      - name: Checkpoint DB to data branch
        if: always()
        run: |
          echo "=== データのチェックポイント保存 ==="
          DB_FILE=""
          if [ -f pakapaka.db ]; then
            DB_FILE="pakapaka.db"
          elif [ -f backend/pakapaka.db ]; then
            DB_FILE="backend/pakapaka.db"
          fi

          if [ -n "$DB_FILE" ]; then
            echo "データベースを gzip 圧縮中 (GitHub 100MB制限対策)..."
            gzip -9 -c "$DB_FILE" > /tmp/pakapaka.db.gz
            echo "✓ 圧縮完了: $(ls -lh "$DB_FILE" | awk '{print $5}') -> $(ls -lh /tmp/pakapaka.db.gz | awk '{print $5}')"

            if [ -d data/models ]; then
              cp -r data/models /tmp/models_backup
            fi
            if [ -d backend/data/models ]; then
              cp -r backend/data/models /tmp/backend_models_backup
            fi

            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"

            # 孤立ブランチ (orphan) を作成
            git checkout --orphan data-temp
            # インデックスのみ初期化 (実ファイルは絶対に消さない)
            git rm --cached -r . > /dev/null 2>&1 || true

            # 圧縮済みDBを配置
            cp /tmp/pakapaka.db.gz pakapaka.db.gz
            git add -f pakapaka.db.gz

            if [ -d /tmp/models_backup ]; then
              mkdir -p data/models
              cp -r /tmp/models_backup/* data/models/ 2>/dev/null || true
              git add -f data/models/ || true
            fi
            if [ -d /tmp/backend_models_backup ]; then
              mkdir -p backend/data/models
              cp -r /tmp/backend_models_backup/* backend/data/models/ 2>/dev/null || true
              git add -f backend/data/models/ || true
            fi

            STATUS_MSG="Auto-checkpoint: ${{ steps.scraper.outputs.scraped_count || 'partial' }}/${{ steps.scraper.outputs.total_target || 'all' }} races (Gen ${{ inputs.iteration }}) [skip ci]"
            git commit -m "$STATUS_MSG"
            git branch -D data > /dev/null 2>&1 || true
            git branch -m data
            git push origin data --force
            echo "✓ data ブランチへ圧縮済み最新データ (pakapaka.db.gz) を force push しました。"
          else
            echo "保存対象の pakapaka.db が見つかりませんでした。"
          fi

      - name: Upload DB Artifact (Backup Guard)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pakapaka-db-checkpoint-gen-${{ inputs.iteration }}
          path: |
            pakapaka.db
            backend/pakapaka.db
          retention-days: 90
          if-no-files-found: ignore

      - name: Auto-retrigger next run if more races remaining
        if: steps.scraper.outputs.has_more == 'true'
        env:
          # PAT (Personal Access Token) が登録されていればそちらを優先 (GITHUB_TOKENでは連鎖トリガー不可のため)
          AUTH_TOKEN: ${{ secrets.AUTO_RESUME_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 次回実行の自動トリガー ==="
          NEXT_ITERATION="${{ steps.scraper.outputs.next_iteration || '2' }}"
          echo "未収集レースが残っているため (${{ steps.scraper.outputs.scraped_count }}/${{ steps.scraper.outputs.total_target }} 件)、次回 (第 ${NEXT_ITERATION} 世代) のワークフローを自動起動します。"

          export GH_TOKEN="$AUTH_TOKEN"
          gh workflow run scrape_auto_resume.yml \
            -f start_year="${{ inputs.start_year }}" \
            -f end_year="${{ inputs.end_year }}" \
            -f max_races="${{ inputs.max_races }}" \
            -f time_limit_minutes="${{ inputs.time_limit_minutes }}" \
            -f iteration="${NEXT_ITERATION}" \
            -f max_iterations="${{ inputs.max_iterations }}" \
            -f skip_train_until_end="${{ inputs.skip_train_until_end }}"

          echo "✓ 次回ジョブ (第 ${NEXT_ITERATION} 世代) の起動リクエストを送信しました！"
